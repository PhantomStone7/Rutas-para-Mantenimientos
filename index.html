<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ruta de Entregas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .delivered { background-color: green; color: white; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map', { zoomControl: true }).setView([13.3103, -87.1848], 12);
        
        L.tileLayer('https://{s}.tile.jawg.io/jawg-sunny/{z}/{x}/{y}{r}.png?access-token=nvyWYYOXIkVSjIb3dUHvOzMiPkhJSlcoiKcwnpRNDyJ8d24l3H4BNlAvODieirpq', {
            attribution: '&copy; <a href="https://www.jawg.io">Jawg Maps</a> contributors'
        }).addTo(map);

        var puntos = [
           { coords: [13.301728274069427, -87.19455987470468], name: "accel" },
            { coords: [13.3047694339809, -87.18856951576323], name: "moliniita" },
            { coords: [13.303439119614971, -87.19455778540862], name: "acosa" },
            { coords: [13.31560679109185, -87.1645840458689], name: "alutech" },
            { coords: [13.312521976037354, -87.17351001365256], name: "analiza 2" },
            { coords: [113.30303657694858, -87.19704162601141], name: "analiza" },
            { coords: [13.309660502554385, -87.18950618878294], name: "basilios" },
            { coords: [13.300664967993566, -87.19196674430611], name: "compisur" },
            { coords: [13.3089595941516, -87.17869461757061], name: "demaro" },
            { coords: [13.306574548671511, -87.18543707298039], name: "dental shop" },
            { coords: [13.306943505312073, -87.17859770343532], name: "dkache" },
            { coords: [13.302768169436485, -87.19289058368558], name: "san miguel" },
            { coords: [13.333082459851397, -87.13580995728024], name: "herco ya" },
            { coords: [13.301050245709035, -87.19512797127629], name: "copymax" },
            { coords: [13.293526710665605, -87.15110610887207], name: "foam" },
            { coords: [13.303370336794945, -87.1942751012879], name: "fertica" },
            { coords: [13.302794322897842, -87.1838408232065], name: "puma aterrizaje" },
            { coords: [13.298529441324911, -87.19546066795805], name: "Hotel victoria" },
            { coords: [13.311160371215276, -87.17892850723734], name: "grupo q" },
            { coords: [13.303552309815222, -87.2003669612112], name: "hotel casa de luna" },
            { coords: [13.303850906099463, -87.18807084186761], name: "IC del caribe" },
            { coords: [13.316961435540952, -87.16218539619219], name: "jardines y piscinas" },
            { coords: [13.30697777065427, -87.18979343073478], name: "americana lee" },
            { coords: [13.292164435544555, -87.17802467285617], name: "jicaral" },
            { coords: [13.31001083084995, -87.18215873431592], name: "little caesars" },
            { coords: [13.304738116296237, -87.1921685464473], name: "megafardos" },
            { coords: [13.311786054237771, -87.17459984652822], name: "megafardos platinum" },
            { coords: [13.309431137815166, -87.18659240538874], name: "miralda" },
            { coords: [13.317477293832347, -87.16079638308703], name: "moto repuestos" },
            { coords: [13.30079965982162, -87.18794615163117], name: "motopartes meza" },
            { coords: [13.304049719706718, -87.18216150669856], name: "nichas" },
            { coords: [13.304790424674032, -87.1973627349029], name: "oftalmosur" },
            { coords: [13.316903143351293, -87.16236062371141], name: "pagsa" },
            { coords: [13.306144643159472, -87.18963622556006], name: "puma carreto" },
            { coords: [13.309635882065729, -87.19093602292743], name: "pupuseria" },
            { coords: [13.30372605830645, -87.17895235767847], name: "refripartes" },
            { coords: [13.312825152971614, -87.17178585760342], name: "repuestos del atlantico" },
            { coords: [13.307918008257761, -87.1819613095491], name: "repuestos del sur" },
            { coords: [13.297840915454508, -87.18601602200539], name: "ryc Lux" },
            { coords: [13.311705968050669, -87.15972742883551], name: "south" },
            { coords: [13.30798997868764, -87.18817774908685], name: "super empaques" },
            { coords: [13.295318822201258, -87.1911263768791], name: "carbajal " },
            { coords: [13.301338140840073, -87.19391457925103], name: "la colonia 45" },
            { coords: [13.308657952731066, -87.17938976528637], name: "politecnica" },
            { coords: [13.309010662389241, -87.18947997460529], name: "uth" },
            { coords: [13.315872281095055, -87.16352565517833], name: "wwafflos " },
            { coords: [13.3072993705997, -87.18518439975485], name: "yego" },
            
        ];
   
        var markers = puntos.map((point, index) => {
            var marker = L.marker(point.coords).addTo(map);
            marker.bindPopup(`
                <label for='locationName${index}'>Nombre del Lugar:</label>
                <input type='text' id='locationName${index}' value='${point.name}' oninput='updateName(${index}, this.value)'><br>
                <button onclick='markDelivered(${index})'>Marcar como hecho</button>
            `);
            return marker;
        });

        function updateName(index, name) {
            puntos[index].name = name;
        }

        function markDelivered(index) {
            if (markers[index]) {
                map.removeLayer(markers[index]);
                markers[index] = null;
                updateRoute();
            }
        }

        var userMarker = null;
        var userPosition = null;
        var routeLine = null;

        function updateRoute() {
            if (!userPosition) return;
            var remainingPoints = markers.filter(marker => marker !== null).map(marker => marker.getLatLng());
            if (remainingPoints.length === 0) return;
            
            var coordinates = [[userPosition[1], userPosition[0]], ...remainingPoints.map(p => [p.lng, p.lat])].join(';');
            var osrmRouteUrl = `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson`;
            
            fetch(osrmRouteUrl)
                .then(response => response.json())
                .then(data => {
                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }
                    routeLine = L.polyline(data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]), {color: 'blue', weight: 5}).addTo(map);
                })
                .catch(error => console.error("Error obteniendo la ruta: ", error));
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                userPosition = [position.coords.latitude, position.coords.longitude];
                if (userMarker) {
                    userMarker.setLatLng(userPosition);
                } else {
                    userMarker = L.circle(userPosition, {radius: 50, color: 'red', fillColor: 'red', fillOpacity: 0.5}).addTo(map);
                }

                updateRoute();
            }, error => console.error("Error obteniendo la ubicación: ", error), { enableHighAccuracy: true });
        } else {
            alert("Geolocalización no soportada");
        }
    </script>
</body>
</html>
