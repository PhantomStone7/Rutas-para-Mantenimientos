<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ruta de Entregas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .delivered { background-color: green; color: white; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map', { zoomControl: true }).setView([13.3103, -87.1848], 12);
        
        L.tileLayer('https://{s}.tile.jawg.io/jawg-sunny/{z}/{x}/{y}{r}.png?access-token=nvyWYYOXIkVSjIb3dUHvOzMiPkhJSlcoiKcwnpRNDyJ8d24l3H4BNlAvODieirpq', {
            attribution: '&copy; <a href="https://www.jawg.io">Jawg Maps</a> contributors'
        }).addTo(map);

        var puntos = [
           { coords: [13.312818754421079, -87.17594573047938], name: "la mundial" },
            { coords: [13.302998006955654, -87.19562559417173], name: "el compadre" },
            { coords: [13.302966042189215, -87.19383710136943], name: "la nueva moda" },
            { coords: [13.31560679109185, -87.1645840458689], name: "barbacoa express" },
            { coords: [13.309665185096119, -87.18956946179105], name: "basilios 1 y 2 jetstereo, tlakeria" },
            { coords: [13.310127188775581, -87.1809738159318], name: "bombos, la colonia" },
            { coords: [13.310050380944022, -87.18188807037893], name: "burger king, circle k, dunkin, lc, popeyes" },
            { coords: [13.317772573471075, -87.16226577359966], name: "cabro blanco" },
            { coords: [13.289641078274295, -87.17907685021555], name: "shell el recreo" },
            { coords: [13.298159888324264, -87.18914780055327], name: "el milenio " },
            { coords: [13.314011267236332, -87.1683814631161], name: "herco" },
            { coords: [13.302811899669377, -87.18385625205322], name: "puma aterrizaje" },
            { coords: [13.308451868471199, -87.17860763047935], name: "puma roady" },
            { coords: [13.31565932533092, -87.19776145660644], name: "uno gualikeme" },
            { coords: [13.304545422903708, -87.19017132969819], name: "garmar, imagen" },
            { coords: [13.303370336794945, -87.1942751012879], name: "herco centro" },
            { coords: [13.294693909947085, -87.1790970041151], name: "casa real" },
            { coords: [13.313713877424542, -87.19169694952599], name: "Hotel gualiqueme" },
            { coords: [13.310032871563683, -87.18804046116676], name: "la fuente" },
            { coords: [13.307027346567958, -87.1897616717291], name: "americana lee" },
            { coords: [13.304604775038314, -87.19192004101468], name: "jetstereo, motomundo" },
            { coords: [13.309529589328088, -87.18529974181087], name: "kfc, pizza hut" },
            { coords: [13.316857750204088, -87.19955127465897], name: "llantilandia" },
            { coords: [13.311786054237771, -87.17459984652822], name: "megafardos platinum" },
            { coords: [13.312461222495763, -87.17274699263795], name: "mercadito 24-7" },
            { coords: [13.335050001399258, -87.13438250349465], name: "mercadito popular" },
            { coords: [13.347834577154364, -87.11660511698673], name: "mini market el barato" },
            { coords: [13.316356088318601, -87.16184868327379], name: "pollisimo" },
            { coords: [13.309195177517962, -87.18804809389603], name: "pronto choluteca, uno" },
            { coords: [13.306144643159472, -87.18963622556006], name: "puma carreto" },
            { coords: [13.323868464225034, -87.21426104213418], name: "puma panamericana" },
            { coords: [13.31034174344827, -87.17912538948079], name: "pupusas miraflores" },
            { coords: [13.310286040439006, -87.184945245823], name: "el asador" },
            { coords: [13.293454291630917, -87.19313564230768], name: "shell el estadio" },
            { coords: [13.295273945777982, -87.190958357464], name: "la carbajal" },
            { coords: [13.311705968050669, -87.15972742883551], name: "south" },
            { coords: [13.30798997868764, -87.18817774908685], name: "super empaques" },
            { coords: [13.295318822201258, -87.1911263768791], name: "carbajal " },
            { coords: [13.296682914594575, -87.17887684610284], name: "texaco las brisas" },
            { coords: [13.30838146559572, -87.17961242704553], name: "tiendas lee" },
            
        ];
   
        var markers = puntos.map((point, index) => {
            var marker = L.marker(point.coords).addTo(map);
            marker.bindPopup(`
                <label for='locationName${index}'>Nombre del Lugar:</label>
                <input type='text' id='locationName${index}' value='${point.name}' oninput='updateName(${index}, this.value)'><br>
                <button onclick='markDelivered(${index})'>Marcar como hecho</button>
            `);
            return marker;
        });

        function updateName(index, name) {
            puntos[index].name = name;
        }

        function markDelivered(index) {
            if (markers[index]) {
                map.removeLayer(markers[index]);
                markers[index] = null;
                updateRoute();
            }
        }

        var userMarker = null;
        var userPosition = null;
        var routeLine = null;

        function updateRoute() {
            if (!userPosition) return;
            var remainingPoints = markers.filter(marker => marker !== null).map(marker => marker.getLatLng());
            if (remainingPoints.length === 0) return;
            
            var coordinates = [[userPosition[1], userPosition[0]], ...remainingPoints.map(p => [p.lng, p.lat])].join(';');
            var osrmRouteUrl = `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson`;
            
            fetch(osrmRouteUrl)
                .then(response => response.json())
                .then(data => {
                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }
                    routeLine = L.polyline(data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]), {color: 'blue', weight: 5}).addTo(map);
                })
                .catch(error => console.error("Error obteniendo la ruta: ", error));
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                userPosition = [position.coords.latitude, position.coords.longitude];
                if (userMarker) {
                    userMarker.setLatLng(userPosition);
                } else {
                    userMarker = L.circle(userPosition, {radius: 50, color: 'red', fillColor: 'red', fillOpacity: 0.5}).addTo(map);
                }

                updateRoute();
            }, error => console.error("Error obteniendo la ubicación: ", error), { enableHighAccuracy: true });
        } else {
            alert("Geolocalización no soportada");
        }
    </script>
</body>
</html>
