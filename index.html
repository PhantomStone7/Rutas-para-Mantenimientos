        // =========================================================
        // ENVÍOS COMPLETADOS
        // =========================================================

        // Cargar los envíos que ya fueron marcados como hechos
        var completedPoints = JSON.parse(
            localStorage.getItem('completedPoints') || '[]'
        );


        // =========================================================
        // CREAR MARCADORES
        // =========================================================

        var markers = puntos.map((point, index) => {

            // Identificador único del lugar
            var pointId =
                point.name +
                "_" +
                point.coords[0] +
                "_" +
                point.coords[1];


            // Si ya está completado, no mostrarlo
            if (completedPoints.includes(pointId)) {
                return null;
            }


            var marker = L.marker(point.coords).addTo(map);


            marker.pointId = pointId;


            marker.bindPopup(`
                <label for="locationName${index}">
                    Nombre del Lugar:
                </label>

                <input
                    type="text"
                    id="locationName${index}"
                    value="${point.name}"
                    oninput="updateName(${index}, this.value)"
                >

                <br><br>

                <button onclick="markDelivered(${index})">
                    Marcar como hecho
                </button>
            `);


            return marker;

        });


        // =========================================================
        // ACTUALIZAR NOMBRE
        // =========================================================

        function updateName(index, name) {

            puntos[index].name = name;

        }


        // =========================================================
        // MARCAR ENVÍO COMO HECHO
        // =========================================================

        function markDelivered(index) {

            var marker = markers[index];


            if (!marker) {
                return;
            }


            // Identificador del punto
            var pointId = marker.pointId;


            // Evitar duplicados
            if (!completedPoints.includes(pointId)) {

                completedPoints.push(pointId);


                localStorage.setItem(
                    'completedPoints',
                    JSON.stringify(completedPoints)
                );

            }


            // Eliminar marcador del mapa
            map.removeLayer(marker);


            markers[index] = null;


            // Actualizar ruta
            updateRoute();

        }


        // =========================================================
        // UBICACIÓN DEL USUARIO
        // =========================================================

        var userMarker = null;

        var userPosition = null;

        var routeLine = null;


        // =========================================================
        // ACTUALIZAR RUTA
        // =========================================================

        function updateRoute() {

            if (!userPosition) {
                return;
            }


            var remainingPoints = markers
                .filter(marker => marker !== null)
                .map(marker => marker.getLatLng());


            if (remainingPoints.length === 0) {

                if (routeLine) {
                    map.removeLayer(routeLine);
                    routeLine = null;
                }

                return;

            }


            var coordinates = [
                [userPosition[1], userPosition[0]],
                ...remainingPoints.map(
                    p => [p.lng, p.lat]
                )
            ].join(';');


            var osrmRouteUrl =
                `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson`;


            fetch(osrmRouteUrl)

                .then(response => response.json())

                .then(data => {

                    if (
                        !data.routes ||
                        data.routes.length === 0
                    ) {
                        return;
                    }


                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }


                    routeLine = L.polyline(
                        data.routes[0].geometry.coordinates.map(
                            coord => [coord[1], coord[0]]
                        ),
                        {
                            color: 'blue',
                            weight: 5
                        }
                    ).addTo(map);

                })

                .catch(
                    error =>
                        console.error(
                            "Error obteniendo la ruta: ",
                            error
                        )
                );

        }


        // =========================================================
        // GEOLOCALIZACIÓN
        // =========================================================

        if (navigator.geolocation) {

            navigator.geolocation.watchPosition(

                position => {

                    userPosition = [
                        position.coords.latitude,
                        position.coords.longitude
                    ];


                    if (userMarker) {

                        userMarker.setLatLng(
                            userPosition
                        );

                    } else {

                        userMarker = L.circle(
                            userPosition,
                            {
                                radius: 50,
                                color: 'red',
                                fillColor: 'red',
                                fillOpacity: 0.5
                            }
                        ).addTo(map);

                    }


                    updateRoute();

                },


                error => {

                    console.error(
                        "Error obteniendo la ubicación: ",
                        error
                    );

                },


                {
                    enableHighAccuracy: true
                }

            );

        } else {

            alert(
                "Geolocalización no soportada"
            );

        }
